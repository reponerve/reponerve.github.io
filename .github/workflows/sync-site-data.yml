name: Sync site data from reponerve

on:
  schedule:
    # Weekly — catch drift if a release webhook was missed
    - cron: '0 12 * * 1'
  workflow_dispatch:
  repository_dispatch:
    types: [reponerve-released]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync facts from reponerve/reponerve
        run: node scripts/sync-site-data.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet src/site-data.json; then
            echo "site-data.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/site-data.json
          git commit -m "chore(website): sync site data from reponerve/reponerve"
          git push
